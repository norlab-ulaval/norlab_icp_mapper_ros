# Legacy fallback config. Prefer _mapper.yaml for production use.
# Critical fixes applied (branch: mohamed):
#   - maxDist: 200.0 → 2.0  (was causing false long-range correspondences and drift)
#   - updateCondition: delay→distance  (time-based caused large odom gaps at speed)
#   - Removed readingDataPointsFilters double-sampling
#   - Added BoundingBox self-filters (chassis + sensor pod)
#   - Added post SurfaceNormalDataPointsFilter (required by PointToPlane ICP)
#   - Added BoundTransformationChecker safety net

mapper:
  updateCondition:
    type: distance
    value: 0.15

  sensorMaxRange: 60.0

  mapperModule:
    - PointDistanceMapperModule:
        minDistNewPoint: 0.05

input:
  - BoundingBoxDataPointsFilter:
      xMin: -0.90
      xMax:  0.70
      yMin: -0.40
      yMax:  0.40
      zMin: -0.10
      zMax:  0.85
      removeInside: 1

  - BoundingBoxDataPointsFilter:
      xMin: -0.25
      xMax:  0.15
      yMin: -0.20
      yMax:  0.20
      zMin:  0.70
      zMax:  1.10
      removeInside: 1

  - RandomSamplingDataPointsFilter:
      prob: 0.8

icp:
  outlierFilters:
    - TrimmedDistOutlierFilter:
        ratio: 0.75

  matcher:
    KDTreeMatcher:
      knn: 5
      epsilon: 1
      maxDist: 2.0

  errorMinimizer:
    PointToPlaneErrorMinimizer:
      force4DOF: 1

  transformationCheckers:
    - CounterTransformationChecker:
        maxIterationCount: 40
    - DifferentialTransformationChecker:
        minDiffRotErr: 0.001
        minDiffTransErr: 0.01
        smoothLength: 3
    - BoundTransformationChecker:
        maxRotationNorm: 0.5
        maxTranslationNorm: 2.0

  inspector: NullInspector

  logger: NullLogger

post:
  - SurfaceNormalDataPointsFilter:
      knn: 10
